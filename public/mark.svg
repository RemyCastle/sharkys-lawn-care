<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" fill="none" role="img" aria-labelledby="markTitle markDesc">
  <title id="markTitle">Sharky's Lawn Care mark</title>
  <desc id="markDesc">Original flat cartoon of a muscular shark in a green hoodie pushing a walk-behind mower, grass flying off the deck.</desc>

  <g opacity="0.85" stroke="#36414C" stroke-width="10" stroke-linecap="round">
    <path d="M40 210h150"/>
    <path d="M28 250h170"/>
    <path d="M52 290h130"/>
    <path d="M36 330h155"/>
  </g>

  <ellipse cx="430" cy="576" rx="260" ry="22" fill="#36414C"/>

  <!-- walk-behind deck, moving right -->
  <g stroke="#0B0F0C" stroke-width="7" stroke-linejoin="round">
    <path d="M338 404h318c22 0 36 16 36 34v36c0 14-12 24-26 24H352c-18 0-30-12-30-28v-40c0-14 8-26 16-26z" fill="#0B0F0C"/>
    <rect x="348" y="416" width="300" height="16" fill="#3F8C10"/>
    <path d="M640 430h46v28h-30z" fill="#36414C"/>
    <circle cx="392" cy="508" r="36" fill="#0B0F0C"/>
    <circle cx="392" cy="508" r="16" fill="#36414C"/>
    <circle cx="392" cy="508" r="6" fill="#F4F5F3"/>
    <circle cx="612" cy="500" r="48" fill="#0B0F0C"/>
    <circle cx="612" cy="500" r="22" fill="#36414C"/>
    <circle cx="612" cy="500" r="8" fill="#F4F5F3"/>
    <!-- handle, walk-behind -->
    <path d="M360 404V248c0-16 12-28 28-28h168c16 0 28 12 28 28v28" fill="none" stroke="#0B0F0C" stroke-width="14"/>
    <path d="M388 220h176" stroke="#36414C" stroke-width="16" stroke-linecap="round"/>
    <path d="M388 220h176" stroke="#0B0F0C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- grass flying off the chute -->
  <g fill="#3F8C10" stroke="#0B0F0C" stroke-width="5" stroke-linejoin="round">
    <path d="M690 390l22-48 18 46z"/>
    <path d="M724 368l16-42 18 40z"/>
    <path d="M756 394l14-36 16 34z"/>
    <path d="M708 430l20-30 14 28z"/>
    <path d="M742 444l16-26 12 24z"/>
    <path d="M678 448l14-22 12 20z"/>
    <path d="M770 428l12-24 12 22z"/>
  </g>

  <!-- hoodie shark, standing, hunched on the handle -->
  <g stroke="#0B0F0C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <path d="M268 430c8 46 12 78 8 96h40c8-20 10-50 6-86z" fill="#0B0F0C"/>
    <path d="M324 436c6 42 8 74 4 90h38c6-18 8-48 4-82z" fill="#0B0F0C"/>
    <!-- hoodie torso, leaning forward -->
    <path d="M236 250c-10 70 8 130 48 168 46-8 92-20 118-54 8-40-16-96-70-132-32-22-78-18-96 18z" fill="#3F8C10"/>
    <!-- hood -->
    <path d="M250 128c-36 24-48 78-30 122 28-6 58-4 86 10 10-40-8-92-56-132z" fill="#3F8C10"/>
    <!-- dorsal fin -->
    <path d="M318 96l36 78-68 8c12-32 20-58 32-86z" fill="#36414C"/>
    <!-- head / snout -->
    <ellipse cx="292" cy="188" rx="72" ry="62" fill="#36414C"/>
    <path d="M330 168c28 6 62 22 78 44-18 18-48 28-84 24" fill="#36414C"/>
    <path d="M248 196c18 22 64 30 108 12" stroke="#F4F5F3" stroke-width="14"/>
    <!-- eyes -->
    <ellipse cx="278" cy="172" rx="13" ry="15" fill="#0B0F0C"/>
    <circle cx="282" cy="166" r="4" fill="#F4F5F3"/>
    <ellipse cx="318" cy="168" rx="13" ry="15" fill="#0B0F0C"/>
    <circle cx="322" cy="162" r="4" fill="#F4F5F3"/>
    <!-- teeth -->
    <path d="M270 214h78c4 14-8 30-38 32-28-2-42-16-40-32z" fill="#0B0F0C"/>
    <path d="M282 218h12l3 12h-11z" fill="#F4F5F3" stroke-width="3"/>
    <path d="M300 218h12l3 12h-11z" fill="#F4F5F3" stroke-width="3"/>
    <path d="M318 218h12l3 12h-11z" fill="#F4F5F3" stroke-width="3"/>
    <!-- arms on the bar -->
    <path d="M300 268c40 8 90 4 140-8 8 16 6 36-8 48-46 10-96 16-138 8-10-14-8-32 6-48z" fill="#3F8C10"/>
    <path d="M430 256c18 4 28 18 24 36 16 2 28-6 34-18-8-16-28-24-58-18z" fill="#36414C"/>
    <path d="M488 248c16 6 22 20 16 34 14 0 26-8 30-18-6-14-24-22-46-16z" fill="#36414C"/>
  </g>
</svg>
